<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PROJECT ORBIT | Renders</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">

<style>

:root{
    --black:#0A0D11;
    --graphite:#262B32;
    --orange:#FF6600;
    --white:#F2F4F7;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--black);
    color:var(--white);
    font-family:'Space Grotesk',sans-serif;
}

/* HEADER */

header{
    position:fixed;
    top:0;
    width:100%;
    height:75px;

    background:rgba(10,13,17,.95);
    backdrop-filter:blur(10px);

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 50px;

    z-index:1000;

    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
    font-family:'Rajdhani',sans-serif;
    font-size:2rem;
    font-weight:700;
    color:var(--orange);
    letter-spacing:2px;
}

nav a{
    text-decoration:none;
    color:white;
    margin-left:30px;
    font-family:'Rajdhani',sans-serif;
    font-weight:600;
    transition:.25s;
}

nav a:hover{
    color:var(--orange);
}

/* PAGE TITLE */

.hero{
    padding-top:140px;
    padding-bottom:60px;
    text-align:center;
}

.hero h1{
    font-family:'Rajdhani',sans-serif;
    font-size:5rem;
    color:var(--orange);
}

.hero p{
    color:#b0b0b0;
    margin-top:10px;
}

/* GALLERY */

.gallery{
    width:min(1400px,90%);
    margin:auto;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(350px,1fr));

    gap:25px;

    padding-bottom:80px;
}

.render{
    position:relative;
    overflow:hidden;

    border-radius:12px;

    cursor:pointer;

    background:var(--graphite);

    border:1px solid rgba(255,255,255,.05);

    transition:.3s;
}

.render:hover{
    border-color:var(--orange);

    box-shadow:
    0 0 25px rgba(255,102,0,.25);
}

.render img{
    width:100%;
    height:100%;

    display:block;

    transition:.35s;
}

.render:hover img{
    transform:scale(1.05);
    filter:brightness(.6);
}

/* LIGHTBOX */

.lightbox{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.95);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:5000;
}

.lightbox.active{
    display:flex;
}

.lightbox img{
    max-width:92%;
    max-height:92%;

    border-radius:8px;
}

.close{
    position:absolute;

    top:20px;
    right:35px;

    font-size:50px;
    color:white;

    cursor:pointer;
}

.arrow{
    position:absolute;

    top:50%;
    transform:translateY(-50%);

    font-size:70px;

    color:white;

    cursor:pointer;

    user-select:none;

    padding:20px;
}

.left{
    left:20px;
}

.right{
    right:20px;
}

/* FOOTER */

footer{
    text-align:center;
    color:#888;
    padding:40px;
}

@media(max-width:768px){

header{
    padding:0 20px;
}

nav a{
    margin-left:15px;
}

.hero h1{
    font-size:3.5rem;
}

.gallery{
    grid-template-columns:1fr;
}

.arrow{
    font-size:50px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">PROJECT ORBIT</div>

<nav>
    <a href="index.html">HOME</a>
    <a href="renders.html">RENDERS</a>
    <a href="documentation.html">DOCUMENTATION</a>
    <a href="cad.html">CAD</a>
</nav>

</header>

<section class="hero">

<h1>RENDER GALLERY</h1>

<p>
FTC CAD Competition Submission
</p>

</section>

<div class="gallery">

<div class="render"><img src="render1.jpg"></div>
<div class="render"><img src="render2.jpg"></div>
<div class="render"><img src="render3.jpg"></div>
<div class="render"><img src="render4.jpg"></div>
<div class="render"><img src="render5.jpg"></div>
<div class="render"><img src="render6.jpg"></div>
<div class="render"><img src="render7.jpg"></div>
<div class="render"><img src="render8.jpg"></div>
<div class="render"><img src="render9.jpg"></div>
<div class="render"><img src="render10.jpg"></div>

</div>

<footer>
PROJECT ORBIT • FTC CAD COMPETITION ENTRY
</footer>

<!-- LIGHTBOX -->

<div class="lightbox" id="lightbox">

<span class="close">&times;</span>

<span class="arrow left">&#10094;</span>

<img id="lightboxImage">

<span class="arrow right">&#10095;</span>

</div>

<script>

const renders = document.querySelectorAll('.render img');
const lightbox = document.getElementById('lightbox');
const lightboxImage = document.getElementById('lightboxImage');

let current = 0;

function openImage(index){
    current = index;
    lightboxImage.src = renders[index].src;
    lightbox.classList.add('active');
}

renders.forEach((img,index)=>{
    img.addEventListener('click',()=>{
        openImage(index);
    });
});

document.querySelector('.close').onclick=()=>{
    lightbox.classList.remove('active');
};

document.querySelector('.left').onclick=()=>{
    current =
    (current - 1 + renders.length)
    % renders.length;

    lightboxImage.src =
    renders[current].src;
};

document.querySelector('.right').onclick=()=>{
    current =
    (current + 1)
    % renders.length;

    lightboxImage.src =
    renders[current].src;
};

document.addEventListener('keydown',(e)=>{

    if(!lightbox.classList.contains('active'))
        return;

    if(e.key==="Escape")
        lightbox.classList.remove('active');

    if(e.key==="ArrowLeft")
        document.querySelector('.left').click();

    if(e.key==="ArrowRight")
        document.querySelector('.right').click();

});

lightbox.addEventListener('click',(e)=>{

    if(e.target===lightbox)
        lightbox.classList.remove('active');

});

</script>

</body>
</html>
